<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Parts | Vedlikehold Viking Fjord</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07111f;--panel:#0f1c2e;--panel2:#14243a;--line:#243650;--text:#f4f7fb;--muted:#94a4ba;--blue:#2d8cff;--green:#22c55e;--yellow:#f5b82e;--red:#ef4444;--safe:env(safe-area-inset-top,0px)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#07111f,#0a1728 55%,#07111f);color:var(--text);font:15px Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.top{height:calc(66px + var(--safe));padding:calc(var(--safe) + 10px) 16px 10px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;position:sticky;top:0;z-index:20;background:rgba(7,17,31,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.top h1{font-size:20px;text-align:center;margin:0}.icon{border:0;background:var(--panel2);color:white;border-radius:13px;height:42px;font-size:20px}.wrap{max-width:1100px;margin:auto;padding:18px 16px 90px}.hero{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}.hero h2{margin:0 0 3px;font-size:24px}.muted{color:var(--muted)}button,input,select,textarea{font:inherit}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:700;background:var(--blue);color:white}.btn.secondary{background:var(--panel2);border:1px solid var(--line)}.btn.danger{background:#7f1d1d}.grid{display:grid;grid-template-columns:250px 1fr;gap:16px}.card{background:rgba(15,28,46,.92);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 12px 35px rgba(0,0,0,.2)}.cats{display:flex;flex-direction:column;gap:7px}.cat{padding:10px 11px;border-radius:11px;color:var(--muted);cursor:pointer}.cat.active,.cat:hover{background:var(--panel2);color:white}.sub{padding-left:25px;font-size:13px}.search{display:flex;gap:9px;margin-bottom:14px}.search input{width:100%}.field,input,select,textarea{width:100%;background:#091525;color:white;border:1px solid var(--line);border-radius:12px;padding:11px;outline:none}.field:focus,input:focus{border-color:var(--blue)}.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.part{border:1px solid var(--line);background:#0b1829;border-radius:15px;padding:14px}.parttop{display:flex;justify-content:space-between;gap:8px}.part h3{font-size:16px;margin:0 0 4px}.badge{width:12px;height:12px;border-radius:50%;box-shadow:0 0 10px currentColor}.green{background:var(--green);color:var(--green)}.yellow{background:var(--yellow);color:var(--yellow)}.red{background:var(--red);color:var(--red)}.qty{font-size:26px;font-weight:850;margin:12px 0 4px}.actions{display:flex;gap:7px;margin-top:12px}.actions button{flex:1;padding:8px;border:0;border-radius:10px;background:var(--panel2);color:white}.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:19px;border:0;background:var(--blue);color:white;font-size:30px;box-shadow:0 12px 30px #0008}.cart{position:fixed;left:20px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:10}.count{background:var(--red);border-radius:99px;padding:2px 7px;font-size:12px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.open{display:flex}.sheet{width:min(700px,100%);max-height:92vh;overflow:auto;background:var(--panel);border-radius:22px 22px 0 0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}.sheet h2{margin-top:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.row{display:flex;gap:9px;align-items:center}.orderline{display:grid;grid-template-columns:1fr 90px 38px;gap:8px;align-items:center;margin:8px 0}.empty{text-align:center;padding:50px 15px;color:var(--muted)}footer{text-align:center;color:#68809e;margin-top:40px;font-size:12px}@media(max-width:720px){.grid{grid-template-columns:1fr}.sidebar{display:none}.hero{align-items:flex-start}.hero .btn{font-size:0}.hero .btn:after{content:'Kategorie';font-size:14px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.parts{grid-template-columns:1fr}.wrap{padding-top:14px}}
</style></head><body>
<header class="top"><button class="icon" id="home">⌂</button><h1>Parts</h1><span aria-hidden="true"></span></header>
<main class="wrap"><section class="hero"><div><h2>Magazyn części</h2><div class="muted" id="sync">Tryb lokalny</div></div><button class="btn secondary" onclick="openCategories()">Zarządzaj kategoriami</button></section>
<div class="grid"><aside class="card sidebar"><b>Kategorie</b><div class="cats" id="cats"></div></aside><section class="card"><div class="search"><input id="search" placeholder="Szukaj po nazwie lub numerze części…"><select id="statusFilter" style="max-width:145px"><option value="">Wszystkie stany</option><option value="red">Minimum</option><option value="yellow">Niski</option><option value="green">Dobry</option></select></div><div class="parts" id="parts"></div></section></div><footer>Created and designed by Daniel Wawrzyniak</footer></main>
<button class="btn cart" onclick="openOrders()">Zamówienie <span class="count" id="cartCount">0</span></button><button class="fab" onclick="openPart()">＋</button>
<div class="modal" id="partModal"><div class="sheet"><h2 id="partTitle">Nowa część</h2><form id="partForm" class="formgrid"><input type="hidden" id="pid"><label>Nazwa<input id="pname" required></label><label>Numer części<input id="pnumber" required></label><label>Kategoria<select id="pcat" required></select></label><label>Stan części<select id="pcondition" required><option value="new">Nowa</option><option value="used">Używana</option></select></label><label>Aktualny stan<input id="pqty" type="number" min="0" required></label><label>Stan minimalny<input id="pmin" type="number" min="0" required></label><label>Dostawca<input id="psupplier"></label><label>E-mail dostawcy<input id="pemail" type="email"></label><label class="full">Uwagi<textarea id="pnotes"></textarea></label><button type="button" class="btn secondary" onclick="closeModal('partModal')">Anuluj</button><button class="btn">Zapisz</button></form></div></div>
<div class="modal" id="catModal"><div class="sheet"><h2>Kategorie i podkategorie</h2><div class="row"><input id="newCat" placeholder="Nazwa nowej kategorii"><button class="btn" onclick="addCategory()">Dodaj</button></div><div id="catManage" style="margin:15px 0"></div><button class="btn secondary" onclick="closeModal('catModal')">Zamknij</button></div></div>
<div class="modal" id="orderModal"><div class="sheet"><h2>Generator zamówień</h2><div id="orderLines"></div><div class="row" style="margin-top:15px"><button class="btn secondary" onclick="closeModal('orderModal')">Zamknij</button><button class="btn" onclick="chooseMailLanguage()">Przygotuj e-mail</button></div></div></div>
<div class="modal" id="langModal"><div class="sheet"><h2>Wybierz język wiadomości</h2><div class="actions"><button class="btn" onclick="generateOrders('pl')">🇵🇱 Polski</button><button class="btn" onclick="generateOrders('no')">🇳🇴 Norsk</button><button class="btn" onclick="generateOrders('en')">🇬🇧 English</button><button class="btn secondary" onclick="closeModal('langModal')">Anuluj</button></div></div></div>
<script>
const SUPABASE_URL='https://xgcowpifwmihuukjinuf.supabase.co';
const SUPABASE_KEY='sb_publishable_OvfeU9VHpQt-A8e8MX_ZQQ_tfMpQ3N_';
const LOBBY_URL='https://daniosagand98.github.io/VedlikeholdVikingFjord/';
const DEFAULT_CATS=[{id:'strapex',name:'Strapex',parent:null},{id:'baader',name:'Baader',parent:null},{id:'marel',name:'Marel',parent:null},{id:'knuro',name:'Knuro',parent:null},{id:'elektryczne',name:'Elektryczne',parent:null},{id:'hydrauliczne',name:'Hydrauliczne',parent:null}];
let categories=JSON.parse(localStorage.getItem('parts_categories')||'null')||DEFAULT_CATS, parts=JSON.parse(localStorage.getItem('parts_items')||'[]'),cart=[],activeCat='all',db=null,user=null;
const $=id=>document.getElementById(id), esc=s=>(s??'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function stock(p){if(+p.qty<=+p.min)return'red';if(+p.qty<=Math.ceil(+p.min*1.5))return'yellow';return'green'}
function saveLocal(){localStorage.setItem('parts_categories',JSON.stringify(categories));localStorage.setItem('parts_items',JSON.stringify(parts))}
function renderCats(){let roots=categories.filter(c=>!c.parent);$('cats').innerHTML=`<div class="cat ${activeCat==='all'?'active':''}" onclick="pickCat('all')">Wszystkie części</div>`+roots.map(c=>`<div class="cat ${activeCat===c.id?'active':''}" onclick="pickCat('${c.id}')">${esc(c.name)}</div>`).join('');$('pcat').innerHTML=roots.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}
function pickCat(id){activeCat=id;renderCats();renderParts()}
function renderParts(){let q=$('search').value.toLowerCase(),f=$('statusFilter').value;let list=parts.filter(p=>(activeCat==='all'||p.category===activeCat)&&(!q||p.name.toLowerCase().includes(q)||(p.number||'').toLowerCase().includes(q))&&(!f||stock(p)===f));$('parts').innerHTML=list.length?list.map(p=>`<article class="part"><div class="parttop"><div><h3>${esc(p.name)}</h3><span class="muted">${esc(p.number)}</span></div><i class="badge ${stock(p)}"></i></div><div class="qty">${p.qty} <small class="muted">szt.</small></div><div class="muted">Stan: ${(p.condition||'new')==='used'?'Używana':'Nowa'} · Minimum: ${p.min} · ${esc(p.supplier||'brak dostawcy')}</div><div class="actions"><button onclick="adjust('${p.id}',-1)">−</button><button onclick="adjust('${p.id}',1)">＋</button><button onclick="addCart('${p.id}')">🛒</button><button onclick="openPart('${p.id}')">✎</button></div></article>`).join(''):`<div class="empty">Brak części spełniających kryteria.</div>`}
function openPart(id=''){let p=parts.find(x=>x.id===id);$('partForm').reset();$('pid').value=id;$('partTitle').textContent=p?'Edytuj część':'Nowa część';if(p){$('pname').value=p.name;$('pnumber').value=p.number;$('pcat').value=p.category;$('pcondition').value=p.condition||'new';$('pqty').value=p.qty;$('pmin').value=p.min;$('psupplier').value=p.supplier||'';$('pemail').value=p.email||'';$('pnotes').value=p.notes||''}openModal('partModal')}
$('partForm').onsubmit=async e=>{e.preventDefault();let id=$('pid').value||crypto.randomUUID(),old=parts.find(p=>p.id===id),item={id,name:$('pname').value.trim(),number:$('pnumber').value.trim(),category:$('pcat').value,condition:$('pcondition').value,qty:+$('pqty').value,min:+$('pmin').value,supplier:$('psupplier').value.trim(),email:$('pemail').value.trim(),notes:$('pnotes').value.trim(),user_id:user?.id||null,updated_at:new Date().toISOString()};if(old)parts=parts.map(p=>p.id===id?item:p);else parts.unshift(item);saveLocal();await cloudSave('parts',item);closeModal('partModal');renderParts()};
async function adjust(id,n){let p=parts.find(x=>x.id===id);p.qty=Math.max(0,+p.qty+n);p.updated_at=new Date().toISOString();saveLocal();await cloudSave('parts',p);renderParts()}
function addCart(id){let row=cart.find(x=>x.id===id);if(row)row.orderQty++;else cart.push({id,orderQty:1});$('cartCount').textContent=cart.length}
function openOrders(){$('orderLines').innerHTML=cart.length?cart.map(x=>{let p=parts.find(y=>y.id===x.id);return`<div class="orderline"><div><b>${esc(p.name)}</b><br><span class="muted">${esc(p.number)} · ${esc(p.supplier||'Brak dostawcy')}</span></div><input type="number" min="1" value="${x.orderQty}" onchange="setOrder('${x.id}',this.value)"><button class="icon" onclick="removeCart('${x.id}')">×</button></div>`}).join(''):'<div class="empty">Koszyk zamówienia jest pusty.</div>';openModal('orderModal')}
function setOrder(id,v){cart.find(x=>x.id===id).orderQty=Math.max(1,+v)}function removeCart(id){cart=cart.filter(x=>x.id!==id);$('cartCount').textContent=cart.length;openOrders()}
function chooseMailLanguage(){if(!cart.length){alert('Koszyk zamówienia jest pusty.');return}closeModal('orderModal');openModal('langModal')}
function generateOrders(language){closeModal('langModal');let groups={};cart.forEach(x=>{let p=parts.find(y=>y.id===x.id),key=p.email||'brak-email';(groups[key]??=[]).push({p,q:x.orderQty})});Object.entries(groups).forEach(([email,rows],i)=>{let supplier=rows[0].p.supplier||'Dostawca',lines=rows.map(r=>`- ${r.p.name} | ${language==='pl'?'nr':language==='no'?'nr.':'no.'}: ${r.p.number} | ${language==='pl'?'ilość':language==='no'?'antall':'quantity'}: ${r.q}`).join('\n'),subject,body;if(language==='no'){subject=`Bestilling av deler - ${supplier}`;body=`Hei,\n\nJeg ønsker tilbud og levering av følgende deler:\n\n${lines}\n\nVennligst bekreft pris og leveringstid.\n\nMed vennlig hilsen,\nDaniel Wawrzyniak`}else if(language==='en'){subject=`Parts order - ${supplier}`;body=`Hello,\n\nPlease provide a quotation and delivery for the following parts:\n\n${lines}\n\nPlease confirm the price and delivery time.\n\nBest regards,\nDaniel Wawrzyniak`}else{subject=`Zamówienie części - ${supplier}`;body=`Dzień dobry,\n\nProszę o ofertę i realizację zamówienia na poniższe części:\n\n${lines}\n\nProszę o potwierdzenie ceny i terminu dostawy.\n\nPozdrawiam,\nDaniel Wawrzyniak`}setTimeout(()=>location.href=`mailto:${email==='brak-email'?'':encodeURIComponent(email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`,i*400)})}
function openCategories(){$('catManage').innerHTML=categories.filter(c=>!c.parent).map(c=>`<div class="row" style="margin:7px 0"><span style="flex:1">${esc(c.name)}</span><button class="btn danger" onclick="delCat('${c.id}')">×</button></div>`).join('');openModal('catModal')}
async function addCategory(){let n=$('newCat').value.trim();if(!n)return;let c={id:crypto.randomUUID(),name:n,parent:null,user_id:user?.id||null};categories.push(c);$('newCat').value='';saveLocal();await cloudSave('part_categories',c);renderCats();openCategories()}
async function delCat(id){if(parts.some(p=>p.category===id)){alert('Najpierw przenieś części z tej kategorii.');return}categories=categories.filter(c=>c.id!==id);saveLocal();if(db)await db.from('part_categories').delete().eq('id',id);renderCats();openCategories()}
function openModal(id){$(id).classList.add('open')}function closeModal(id){$(id).classList.remove('open')}
$('search').oninput=renderParts;$('statusFilter').onchange=renderParts;
$('home').onclick=()=>{if(window.parent!==window){window.parent.postMessage({type:'vf-open-lobby'},'https://daniosagand98.github.io')}else location.href=LOBBY_URL};
function getConfig(){return{url:SUPABASE_URL,key:SUPABASE_KEY}}
async function cloudSave(table,item){if(!db)return;let {error}=await db.from(table).upsert(item);if(error)console.warn(error.message)}
async function reloadSharedParts(){let [pr,cr]=await Promise.all([db.from('parts').select('*').order('updated_at',{ascending:false}),db.from('part_categories').select('*')]);if(!pr.error)parts=(pr.data||[]).map(p=>({...p,condition:p.condition||'new'}));if(!cr.error&&cr.data?.length)categories=cr.data.filter(c=>!c.parent);saveLocal();$('sync').textContent=pr.error?'Błąd synchronizacji: '+pr.error.message:'Dane zsynchronizowane z Strapex';renderCats();renderParts()}
async function initCloud(){let c=getConfig();try{db=supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let {data}=await db.auth.getSession();user=data.session?.user||null;if(!user){location.href=LOBBY_URL;return}await reloadSharedParts();db.channel('shared-parts-live').on('postgres_changes',{event:'*',schema:'public',table:'parts'},reloadSharedParts).subscribe()}catch(e){$('sync').textContent='Błąd połączenia z Supabase'}}
renderCats();renderParts();initCloud();
</script></body></html>
